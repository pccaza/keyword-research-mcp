[project]
name = "keyword-research-mcp"
version = "0.1.0"
description = "A local MCP server for normalized Google Ads keyword-planning data"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{ name = "Keyword Research MCP contributors" }]
dependencies = [
    "google-ads==31.2.0",
    "mcp>=2,<3",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
keyword-research-mcp = "keyword_research_mcp.server:main"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyword_research_mcp"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
